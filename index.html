<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基金重仓股当日平均涨跌幅</title>
<style>
  * { box-sizing: border-box; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eef2f9 0%,#e6ecf7 100%);
    margin:0; min-height:100vh; color:#1f2733;
  }
  .wrap{ max-width:780px; margin:0 auto; padding:32px 16px 48px; }
  h1{ font-size:21px; font-weight:700; text-align:center; margin:8px 0 4px; }
  .sub{ text-align:center; color:#9aa3b2; font-size:12px; margin-bottom:24px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .card{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border-radius:14px; padding:18px 24px;
    box-shadow:0 2px 12px rgba(30,50,90,.06);
  }
  .fname{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .nm{ font-size:16px; font-weight:600; }
  .nmlink{ color:#1f2733; text-decoration:none; border-bottom:1px solid #c2cbe0; cursor:pointer; }
  .nmlink:hover{ color:#3b6cf6; border-bottom-color:#3b6cf6; }
  .fc{ font-size:12px; color:#9aa3b2; }
  .fval{ font-size:30px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; }
  .up{ color:#e0392f; }     /* 红涨（国内习惯） */
  .down{ color:#11a36b; }   /* 绿跌 */
  .miss{ font-size:11px; color:#c2cbe0; width:100%; text-align:right; margin-top:6px; }
  .status{ text-align:center; color:#8a93a3; font-size:12px; margin-top:22px; min-height:16px; }
  .btn{
    display:block; margin:22px auto 0; padding:10px 28px; border:none; border-radius:10px;
    background:#3b6cf6; color:#fff; cursor:pointer; font-size:14px;
  }
  .btn:hover{ background:#2f59d6; }
  .btn:disabled{ background:#c2cbe0; cursor:default; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>基金重仓股当日平均涨跌幅</h1>
    <div class="sub">平均涨跌幅 = 该基金前十大重仓股当日涨跌幅的算术平均（红涨绿跌，行情为实时数据）</div>
    <div id="list" class="list"></div>
    <button class="btn" id="reloadBtn" onclick="loadAll()">重新加载</button>
    <div id="status" class="status"></div>
  </div>

<script>
// 基金列表（持仓为 2026Q2 季报前十大重仓股；012863 为联接基金，采用最近有股票持仓的 2024Q3 数据作兜底）
// 持仓代码内置兜底：本地/跨域受限环境下 jjcc 接口会被 Referer 校验拒绝，故内置；页面仍会优先尝试实时 jjcc
const FUNDS = [
  { code:'320007', name:'诺安成长混合A',
    holdings:['1.688361','1.688012','0.002371','1.688981','0.300661','0.301269','1.688072','1.688036','1.688692','1.688347'] },
  { code:'001717', name:'工银前沿医疗股票A',
    holdings:['0.002653','1.603259','1.600276','0.002422','0.300765','1.688331','1.688235','1.688266','0.300347','1.688301'] },
  { code:'002083', name:'新华鑫动力灵活配置混合A',
    holdings:['0.300750','0.300274','1.688503','1.688783','0.301150','0.300037','1.688172','0.002407','0.300568','1.688120'] },
  { code:'004348', name:'南方中证500ETF联接(LOF)C',
    holdings:['1.688498','0.300604','0.001309','1.688347','1.688120','0.002281','0.002008','0.300136','0.300857','1.688361'] },
  { code:'012734', name:'易方达中证人工智能主题ETF联接C',
    holdings:['1.688256','1.688008','1.688041','0.300502','0.300308','1.603019','1.688521','0.002415','1.688795','0.002281'] },
  { code:'012863', name:'汇添富中证电池主题ETF发起式联接C',
    holdings:['0.300274','0.300750','0.300014','0.002050','0.002340','0.300207','0.002074','1.605117','0.300037','0.002709'] },
  { code:'024749', name:'博时中证卫星产业指数C',
    holdings:['1.600118','1.600879','1.601698','1.688375','1.688568','0.300627','1.688521','0.002151','0.300672','0.300593'] }
];
const QUARTERS = [['2026','6'],['2026','3'],['2025','12'],['2025','9']];

function setStatus(t){ document.getElementById('status').textContent = t; }

let HOLDINGS = {};      // 各基金重仓股代码：初始用内置兜底，jjcc 可用时实时覆盖
let refreshTimer = null; // 自动刷新定时器

// 加载 GBK 编码的官方接口（需指定 charset 否则中文乱码）
function loadScriptGBK(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.charset = 'gbk';
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    s.onload  = () => setTimeout(resolve, 0);
    s.onerror = () => reject(new Error('脚本加载失败'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('加载超时')), 6000);
  });
}

// 尝试实时 jjcc 获取某基金重仓股；失败返回 null
async function tryJJCC(code){
  for (const [y, m] of QUARTERS){
    try {
      await loadScriptGBK(
        'https://fundf10.eastmoney.com/FundArchivesDatas.aspx?type=jjcc&code='
        + code + '&year=' + y + '&month=' + m
      );
      const d = window.apidata;
      if (!d || !d.content) continue;
      const rows = [...d.content.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)].map(x => x[1]);
      const stocks = [];
      for (const row of rows){
        const a = row.match(/<a[^>]*href="[^"]*\/r\/(\d\.\d+)"[^>]*>([^<]*)<\/a>/);
        if (a) stocks.push(a[1]);
      }
      if (stocks.length > 0) return stocks;
    } catch(e){ /* 下一季度 */ }
  }
  return null;
}

// 官方 push2 实时行情（UTF-8 JSONP，公开接口不校验 Referer）
function getQuotes(secids){
  return new Promise((resolve, reject) => {
    const cb = '__q' + Date.now() + Math.random().toString(36).slice(2);
    window[cb] = function(d){
      const list = (d && d.data && d.data.diff) || [];
      const map = {};
      list.forEach(it => { if (it && it.f12 != null) map[it.f12] = it.f3; });
      resolve(map);
      delete window[cb];
    };
    const s = document.createElement('script');
    s.src = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids='
          + secids.join(',') + '&fields=f12,f13,f14,f3&cb=' + cb;
    s.onerror = () => reject(new Error('行情接口请求失败'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('行情接口超时')), 10000);
  });
}

function render(map){
  const list = document.getElementById('list');
  list.innerHTML = '';
  // 先计算每只基金的平均涨跌幅
  const items = FUNDS.map(f => {
    const hs = HOLDINGS[f.code] || [];
    let sum = 0, n = 0, miss = 0;
    for (const sec of hs){
      const code = sec.split('.')[1];
      const ch = map[code];
      if (ch != null && ch !== '' && !isNaN(parseFloat(ch))){ sum += parseFloat(ch); n++; }
      else miss++;
    }
    const avg = n > 0 ? sum / n : null;
    return { f, avg, miss };
  });
  // 按平均涨跌幅降序排序（高→低），未取到行情的排到最后
  items.sort((a, b) => {
    const x = a.avg == null ? -Infinity : a.avg;
    const y = b.avg == null ? -Infinity : b.avg;
    return y - x;
  });
  for (const it of items){
    const f = it.f;
    const card = document.createElement('div');
    card.className = 'card';

    const nameEl = document.createElement('div');
    nameEl.className = 'fname';
    nameEl.innerHTML = '<a class="nmlink" href="https://fund.eastmoney.com/' + f.code + '.html?spm=search" target="_blank" rel="noopener">' + f.name + '</a><span class="fc">' + f.code + '</span>';

    const valEl = document.createElement('div');
    valEl.className = 'fval';
    if (it.avg === null){ valEl.textContent = '--'; }
    else {
      valEl.textContent = (it.avg > 0 ? '+' : '') + it.avg.toFixed(2) + '%';
      valEl.classList.add(it.avg >= 0 ? 'up' : 'down');
    }
    card.appendChild(nameEl);
    card.appendChild(valEl);

    if (it.miss > 0){
      const mEl = document.createElement('div');
      mEl.className = 'miss';
      mEl.textContent = '（' + it.miss + ' 只未取到行情）';
      card.appendChild(mEl);
    }
    list.appendChild(card);
  }
}

// 仅刷新实时行情并重算/重排/重渲（持仓沿用 HOLDINGS，季度才变）
async function refresh(){
  const allSecids = [...new Set(FUNDS.flatMap(f => HOLDINGS[f.code] || []))];
  setStatus('获取实时行情…');
  let map = {};
  try {
    map = await getQuotes(allSecids);
  } catch(e){
    setStatus('行情接口失败：' + e.message + '（持仓沿用上次数据）');
    return;
  }
  render(map);
  const now = new Date();
  const next = new Date(now.getTime() + 60000);
  setStatus('数据已更新 · ' + now.toLocaleTimeString('zh-CN')
          + ' · 每 60 秒自动刷新（下次 ' + next.toLocaleTimeString('zh-CN') + '）');
}

async function loadAll(){
  const btn = document.getElementById('reloadBtn');
  btn.disabled = true;

  // 探测 jjcc 在本地环境是否可用（可用则逐只实时获取，否则全部内置兜底）
  let jjccOk = false;
  try {
    await loadScriptGBK('https://fundf10.eastmoney.com/FundArchivesDatas.aspx?type=jjcc&code=001717&year=2026&month=6');
    jjccOk = !!(window.apidata && window.apidata.content);
  } catch(e){ jjccOk = false; }
  setStatus(jjccOk ? '持仓接口可用，获取实时持仓…' : '持仓接口受限，使用内置季报持仓…');

  for (const f of FUNDS){
    let hs = f.holdings.slice();
    if (jjccOk){
      const dyn = await tryJJCC(f.code);
      if (dyn && dyn.length > 0) hs = dyn;
    }
    HOLDINGS[f.code] = hs;
  }

  await refresh();

  btn.disabled = false;
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, 60000); // 每 60 秒自动刷新行情
}

loadAll();
</script>
</body>
</html>
